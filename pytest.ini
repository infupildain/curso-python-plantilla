[pytest]
# Busca tests en todos los módulos y unidades; ignora soluciones, entornos y el paquete generado
testpaths = .
python_files = test_*.py
norecursedirs = .git .venv venv dist solucion herramientas .idea
addopts = -v
# Si un programa se queda en un bucle infinito, el test falla a los 10 s en vez de colgarse
timeout = 10
